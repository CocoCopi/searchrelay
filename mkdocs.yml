site_name: SearchRelay
site_description: The open, self-hostable web search and fetch layer for AI agents.
site_author: SearchRelay contributors
repo_url: https://github.com/searchrelay/searchrelay
repo_name: searchrelay/searchrelay
edit_uri: edit/main/docs/
copyright: Apache-2.0 licensed. SearchRelay is not affiliated with DeepSeek, Brave, Tavily, Exa, or the SearXNG project.

theme:
  name: material
  features:
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - API reference: api.md
  - Providers: providers.md
  - Ranking: ranking.md
  - Security model: security.md
  - Deployment: deployment.md
  - Operations: operations.md
  - Agent integration: agents.md
  - Optional local index: local-index.md
  - Architecture: architecture.md
  - Benchmarks: benchmarks.md
  - FAQ: faq.md
  - Development: good-first-issues.md
