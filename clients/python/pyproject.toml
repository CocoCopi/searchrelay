[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "searchfetch-python"
version = "1.0.0"
description = "Python client for the Search & Fetch API"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[tool.setuptools]
packages = ["searchfetch"]
