[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "searchrelay-mcp"
version = "0.1.0"
description = "Model Context Protocol server for SearchRelay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
searchrelay-mcp = "searchrelay_mcp.server:main"

[tool.setuptools]
packages = ["searchrelay_mcp"]
