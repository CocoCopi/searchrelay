[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "searchrelay"
version = "0.1.0"
description = "SearchRelay: a DeepSeek-compatible web search and fetch API for AI agents and RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "charset-normalizer>=3.3,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "markdownify>=0.13,<2",
  "prometheus-client>=0.20,<1",
  "pydantic-settings>=2.5,<3",
  "pypdf>=5,<7",
  "pyyaml>=6,<7",
  "trafilatura>=2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "fakeredis[lua]>=2.26,<3",
  "locust>=2.31,<3",
  "mkdocs-material>=9.5,<10",
  "mypy>=1.13,<3",
  "numpy>=1.26,<3",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]
redis = [
  "redis>=5,<7",
]
render = [
  "playwright>=1.40,<2",
]
reranker = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.17,<2",
  "tokenizers>=0.19,<1",
]
tracing = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.scripts]
searchrelay-export-openapi = "scripts.export_openapi:main"
searchrelay-admin = "scripts.admin:main"

[tool.setuptools]
packages = ["app", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["app", "scripts", "examples", "clients/python", "benchmarks"]
