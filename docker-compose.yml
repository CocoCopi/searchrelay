services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_SECRET: '${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}'
      SEARXNG_SETTINGS_PATH: /tmp/settings.yml
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        case "$$SEARXNG_SECRET" in
          *[!A-Za-z0-9_-]*) echo 'SEARXNG_SECRET may contain only letters, digits, _ and -' >&2; exit 1 ;;
        esac
        sed "s/__SEARXNG_SECRET__/$$SEARXNG_SECRET/g" /etc/searxng/settings.template.yml > /tmp/settings.yml
        exec /usr/local/searxng/dockerfiles/docker-entrypoint.sh
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.template.yml:ro
      - searxng-cache:/var/cache/searxng
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5)",
        ]
      interval: 20s
      timeout: 8s
      start_period: 30s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SR_UPSTREAM_URL: http://searxng:8080
      SR_API_KEYS_JSON: '${SR_API_KEYS_JSON:?Set SR_API_KEYS_JSON in .env}'
      SR_INITIAL_BALANCES_JSON: '${SR_INITIAL_BALANCES_JSON:?Set SR_INITIAL_BALANCES_JSON in .env}'
      SR_DATABASE_PATH: /data/searchrelay.db
      SR_CACHE_DATABASE_PATH: /data/cache.db
      SR_LOCAL_INDEX_PATH: /data/local-index.db
      SR_REDIS_URL: redis://redis:6379/0
      SR_LOG_JSON: "true"
      SR_SEARCH_QPS: ${SR_SEARCH_QPS:-100}
      SR_FETCH_QPS: ${SR_FETCH_QPS:-25}
      SR_FETCH_DOMAIN_QPS: ${SR_FETCH_DOMAIN_QPS:-5}
      SR_PROVIDER_PRIORITIES: ${SR_PROVIDER_PRIORITIES:-searxng}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
    volumes:
      - searchrelay-data:/data
    ports:
      - "8000:8000"

volumes:
  searchrelay-data:
  searxng-cache:
  redis-data:
