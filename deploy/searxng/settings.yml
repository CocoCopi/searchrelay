use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  # Replaced at container startup from the required SEARXNG_SECRET variable.
  secret_key: "__SEARXNG_SECRET__"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  pool_connections: 50
  pool_maxsize: 20
