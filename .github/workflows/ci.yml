name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check .
      - name: Type-check with mypy
        run: mypy
      - name: Run tests
        run: pytest
      - name: Verify benchmark harness
        run: |
          python -m benchmarks.run \
            --self-test \
            --providers brave,serper,tavily,exa,searxng \
            --output /tmp/searchrelay-benchmark.json
      - name: Build documentation site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict --site-dir /tmp/searchrelay-site

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test TypeScript SDK
        working-directory: clients/typescript
        run: |
          npm ci
          npm test
      - name: Test Go SDK
        working-directory: clients/go
        run: go test ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag searchrelay:ci .
